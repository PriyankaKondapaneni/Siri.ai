<!doctype html><html><head><meta charset="utf-8">
<style>@font-face { font-family: 'Patrick Hand'; src: url(assets/fonts/PatrickHand.ttf); } @font-face { font-family: 'Special Elite'; src: url(assets/fonts/SpecialElite.ttf); } @font-face { font-family: 'Alfa Slab One'; src: url(assets/fonts/AlfaSlabOne.ttf); } body{margin:0}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="src/core.js"></script><script src="src/paper.js"></script><script src="src/ink.js"></script><script src="src/svgpath.js"></script><script src="src/kit.js"></script><script src="src/cast.js"></script>
<script>
const PP = window.PP;
PP.ready = Promise.all(['40px "Patrick Hand"', '40px "Special Elite"', '40px "Alfa Slab One"'].map((f) => document.fonts.load(f)));
PP.totalFrames = 1;
const page = new URLSearchParams(location.search).get('sheet') || 'leads';
PP.renderFrame = (f) => {
  const t = f / 30, ctx = document.getElementById('c').getContext('2d'), b = PP.boil(t);
  ctx.drawImage(PP.bigPaper('kraft', 1080, 1920, 2), 0, 0);
  const label = (x, y, s) => { ctx.font = '34px "Special Elite"'; ctx.fillStyle = '#2a1d26'; ctx.textAlign = 'center'; ctx.fillText(s, x, y); };
  const draw = (who, part, pose, x, y, sc, light) => { const s = PP.person(who, part, pose, b, sc); PP.drawSprite(ctx, light ? PP.lit(s, PP.LIGHTS[light]) : s, x, y); };
  if (page === 'leads') {
    draw('mira', 'head', { eyes: 'open', mouth: 'soft', brows: 'soft', turn: 0.35, look: [4, 0] }, 280, 380, 1.75);
    draw('kabir', 'head', { eyes: 'open', mouth: 'soft', brows: 'neutral', turn: -0.35, look: [-4, 0] }, 800, 400, 1.75);
    label(280, 800, 'MIRA, 22'); label(800, 800, 'KABIR, 25');
    draw('mira', 'bust', { arms: 'down', eyes: 'open', mouth: 'smile', brows: 'soft', turn: 0.2 }, 280, 1560, 0.95);
    draw('kabir', 'bust', { arms: 'watch', eyes: 'open', mouth: 'smirk', brows: 'neutral', turn: -0.2, look: [-3, 0] }, 800, 1560, 0.95);
    label(280, 1640, 'blue dress, red scarf'); label(800, 1640, 'watch stopped at 11:11');
  } else if (page === 'moods') {
    draw('mira', 'head', { eyes: 'down', mouth: 'parted', brows: 'worried', turn: 0.15, phoneLit: 1 }, 270, 330, 1.25, 'phone');
    draw('mira', 'head', { eyes: 'wide', mouth: 'gasp', brows: 'up', turn: -0.2 }, 800, 330, 1.25, 'street');
    draw('mira', 'head', { eyes: 'open', mouth: 'tight', brows: 'worried', turn: 0.35, tears: 1 }, 270, 900, 1.25, 'night');
    draw('mira', 'head', { eyes: 'happy', mouth: 'laugh', brows: 'soft', turn: 0.25, blush: 1 }, 800, 900, 1.25, 'cafe');
    draw('kabir', 'head', { eyes: 'open', mouth: 'parted', brows: 'worried', turn: -0.3, look: [-3, 2] }, 270, 1470, 1.25, 'street');
    draw('kabir', 'head', { eyes: 'narrow', mouth: 'sad', brows: 'worried', turn: 0.2, phoneLit: 1 }, 800, 1470, 1.25, 'phone');
  } else {
    draw('stranger', 'bust', { eyes: 'narrow', mouth: 'smirk', brows: 'flat', turn: 0.25 }, 540, 1300, 1.2, 'train');
    label(540, 1400, 'THE MAN ON THE TRAIN');
  }
};
</script></body></html>
